- name: Install and configure odoos
  hosts: swarm_workers
  become: true
  gather_facts: false
  pre_tasks:
    - name: Get distribution and hostname facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "!min"
          # Platform contains the hostname
          - platform
          - distribution
        filter:
          - ansible_distribution*
          - ansible_hostname
  roles:
    - odoo
