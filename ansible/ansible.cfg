[defaults]
inventory = inventories/prod.yaml
collections_path = /usr/lib/python3.14/site-packages:~/.ansible/collections:./collections
roles_path = roles
host_key_checking = False
filter_plugins = ./filter_plugins:~/.ansible/plugins/filter:/usr/share/ansible/plugins/filter

# -- Output formatting -- #
stdout_callback = default
result_format = yaml

[inventory]
enable_plugins = auto, yaml, ini
