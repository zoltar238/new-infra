---
- name: Create swarm manager project dir with hosts
  file:
    path: "/opt/{{ item.project_name }}"
    state: directory
  loop: "{{ odoo_hosts }}"
  delegate_to: "{{ groups['swarm_managers'][0] }}"

- name: Create project dir
  file:
    path: "{{ odoo_dir_prefix }}{{ item.project_name }}"
    state: directory
  loop: "{{ odoo_hosts }}"

- name: Clone addons repo for each install
  ansible.builtin.git:
    repo: "{{ _prefix }}/{{ _repo }}"
    dest: "{{ odoo_dir_prefix }}{{ item.0.project_name }}/{{ item.1.name }}"
  loop: "{{ odoo_hosts | subelements('repos') }}"
  environment:
    GIT_TERMINAL_PROMPT: 0
  no_log: false
  vars:
    _prefix: "https://{{ odoo_gh_user }}:{{ odoo_gh_user_token }}@github.com"
    _repo: "{{ item.1.url | regex_replace('^.*github\\.com/', '') }}"

- name: Generate .env files
  template:
    src: .env.j2
    dest: "{{ odoo_dir_prefix }}{{ item.project_name }}/.env"
  loop: "{{ odoo_hosts }}"
  when: lookup('ansible.builtin.fileglob', role_path ~ '/templates/.env.j2') | length > 0

- name: Create config dir
  file:
    path: "{{ odoo_dir_prefix }}{{ item.project_name }}/config"
    state: directory
  loop: "{{ odoo_hosts }}"

- name: Generate odoo.conf files
  template:
    src: odoo.conf.j2
    dest: "{{ odoo_dir_prefix }}{{ item.project_name }}/config/odoo.conf"
  loop: "{{ odoo_hosts }}"

- name: Generate postgresql.conf files
  template:
    src: postgresql.conf.j2
    dest: "{{ odoo_dir_prefix }}{{ item.project_name }}/config/postgresql.conf"
  loop: "{{ odoo_hosts }}"

- name: Generate compose files
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "/opt/{{ item.project_name }}/compose.yaml"
  loop: "{{ odoo_hosts }}"
  delegate_to: "{{ groups['swarm_managers'][0] }}"
  register: odoo_compose
  notify: Deploy changed Odoo stacks
