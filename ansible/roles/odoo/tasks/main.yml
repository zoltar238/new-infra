---
- name: Create project map
  set_fact:
    odoo_installations: >-
      {{
        odoo_installations | default([]) + 
      [{
        'odoo_dir': "/opt/odoo_" + item.project_name,
        'max_memory': item.max_memory,
        'max_cpus': item.max_cpus,
        'swarm_manager_odoo_dir': '/opt/' ~ ansible_facts['hostname'],
        'repos': item.repos
      }]
      }}
  loop: "{{odoo_hosts}}"

- name: Create swarm manager project dir
  file:
    path: "{{ item.swarm_manager_odoo_dir }}"
    state: directory
  loop: "{{odoo_installations}}"
  delegate_to: "{{ groups['swarm_managers'][0] }}"

- name: Create project dir
  file:
    path: "{{item.odoo_dir}}"
    state: directory
  loop: "{{odoo_installations}}"

- name: Clone addons repo for each install
  ansible.builtin.git:
    repo: "{{ _prefix }}/{{ _repo }}"
    dest: "{{ item.0.odoo_dir }}/{{ item.1.name }}"
  loop: "{{ odoo_installations | subelements('repos') }}"
  environment:
    GIT_TERMINAL_PROMPT: 0
  no_log: false
  vars:
    _prefix: "https://{{ odoo_gh_user }}:{{ odoo_gh_user_token }}@github.com"
    _repo: "{{ item.1.url | regex_replace('^.*github\\.com/', '') }}"

- name: Generate .env files
  template:
    src: .env.j2
    dest: "{{item.odoo_dir}}/.env"
  loop: "{{odoo_installations}}"

- name: Create config dir
  file:
    path: "{{item.odoo_dir}}/config"
    state: directory
  loop: "{{odoo_installations}}"

- name: Generate odoo.conf files
  template:
    src: odoo.conf.j2
    dest: "{{ item.odoo_dir }}/config/odoo.conf"
  loop: "{{ odoo_installations }}"

- name: Generate postgresql.conf files
  template:
    src: postgresql.conf.j2
    dest: "{{ item.odoo_dir }}/config/postgresql.conf"
  loop: "{{ odoo_installations }}"

- name: Generate compose files
  template:
    src: compose.yaml.j2
    dest: "{{ item.swarm_manager_odoo_dir }}/compose.yaml"
  loop: "{{odoo_installations}}"
  delegate_to: "{{ groups['swarm_managers'][0] }}"
