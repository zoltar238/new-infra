---
- name: Ensure network facts are gathered
  ansible.builtin.setup:
    gather_subset:
      - network
  when: ansible_default_ipv4 is not defined

- name: Create WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-wireguard.conf
    state: present
    reload: true

- name: Generate public key from private key
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ wg_conf_priv_key }}"
  register: wg_conf_public_key
  changed_when: false
  no_log: true

- name: Save public key
  ansible.builtin.copy:
    content: "{{ wg_conf_public_key.stdout }}"
    dest: /etc/wireguard/publickey
    owner: root
    group: root
    mode: "0644"

- name: Display public key for reference
  ansible.builtin.debug:
    msg: "Public key for {{ inventory_hostname }}: {{ wg_conf_public_key.stdout }}"

- name: Get key secrets
  ansible.builtin.command:
    cmd: bws secret list --server-url https://vault.bitwarden.eu
  register: wg_keys_lookup
  delegate_to: localhost
  changed_when: false
  become: false
  run_once: true
  no_log: true

- name: Parse Bitwarden secrets list
  ansible.builtin.set_fact:
    wg_conf_peer_creds: "{{ wg_keys_lookup.stdout | from_json if (wg_keys_lookup.rc == 0 and wg_keys_lookup.stdout | length > 0) else [] }}"
  no_log: true
  run_once: true
  become: false
  delegate_to: localhost

- name: Compute peer list
  ansible.builtin.set_fact:
    wg_conf_peers: >-
      {{
        (wg_conf_peers | default([])) + [
          {
            'user': user.name,
            'priv_key': _priv,
            'public_key': _priv | wg_public_key,
            'psk': (wg_conf_peer_creds | selectattr('key', 'equalto', 'wg_psk_' ~ user.name) | map(attribute='value') | first | default(None)),
            'allowed_ips': (wg_conf_ipv4_subnet | ansible.utils.ipmath(user_idx + 2)) ~ "/32"
          }
        ]
      }}
  loop: "{{ users }}"
  loop_control:
    loop_var: user
    index_var: user_idx
  vars:
    _priv: "{{ wg_conf_peer_creds | selectattr('key', 'equalto', 'wg_priv_' ~ user.name) | map(attribute='value') | first | default('') }}"

- name: Deploy WireGuard server configuration
  ansible.builtin.template:
    src: templates/wg-server.conf.j2
    dest: "/etc/wireguard/{{ wg_conf_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  # Template renders the server private key
  no_log: true
  notify: Restart WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wg_conf_interface }}"
    state: started
    enabled: true

- name: Open WireGuard port in firewall
  community.general.ufw:
    rule: allow
    port: "{{ wg_conf_port }}"
    proto: udp
    comment: "WireGuard VPN"
  failed_when: false

# Apply server changes before later roles, which may fail before play-end handlers.
- name: Apply pending WireGuard configuration changes
  ansible.builtin.meta: flush_handlers
