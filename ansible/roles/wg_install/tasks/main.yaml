- name: Install WireGuard and networking dependencies
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
      - iptables
      - nftables
      - iproute2
    state: present
    update_cache: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
